name: LIBXSMM PPC10-64le

on:
  workflow_dispatch:
  push:

jobs:
  Pull_Branch:
      runs-on:
        group: pcl
      steps:
      - name: Pull Branch ${{ github.ref_name }}
        run: |
          ssh ppc10 "cd libxsmm && git fetch --all --tags --force && git reset --hard ${{ github.sha }} && git clean -fdx"

  GEMM:
      runs-on:
        group: pcl
      needs: Pull_Branch
      steps:
      - name: GEMM
        run: |
          ssh ppc10 "cd libxsmm && ./scripts/tool_test.sh ./samples/xgemm/kernel_test.sh"

  ELTWISE:
      runs-on:
        group: pcl
      needs: GEMM
      steps:
      - name: ELTWISE
        run: |
          ssh ppc10 "cd libxsmm && ./scripts/tool_test.sh ./samples/eltwise/run_test.sh"

  Test_4:
      runs-on:
        group: pcl
      needs: ELTWISE
      steps:
      - name: Test 4
        run: |
          ssh ppc10 "cd libxsmm && ./scripts/tool_test.sh 4"

  Fortran:
      runs-on:
        group: pcl
      needs: Test_4
      steps:
      - name: Fortran
        run: |
          ssh ppc10 "cd libxsmm && ./scripts/tool_test.sh 5"
